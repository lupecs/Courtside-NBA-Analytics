[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "courtside"
version = "0.1.0"
description = "NBA analytics and game outcome prediction platform"
requires-python = ">=3.11,<3.13"
dependencies = [
    "nba_api",
    "pandas",
    "numpy",
    "scikit-learn",
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "python-dotenv",
    "matplotlib",
    "seaborn",
    "plotly",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "jupyterlab",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"